<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог: том 7</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Mono&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000}
  #out{position:absolute;inset:0;margin:auto;display:block;height:100vh;width:133.33vh;max-width:100vw;max-height:75vw;image-rendering:pixelated}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="out" width="960" height="720"></canvas>
<script type="module">
// Финал: особое интро + история 7:00 + особое аутро.
import {FPS,RW,RH,canvas2d,dither,present,loadFonts} from '../common/core.js';
import {INTRO7,OUTRO7,introFinal,outroFinal} from '../common/finale.js';
import {D,drawEp} from './episode.js';
const T=INTRO7+D+OUTRO7;
const [sc,sx]=canvas2d(),[ec,ex]=canvas2d();const out=document.getElementById('out');
const epFrame=t=>{drawEp(t,ex);return ec};
function render(t){t=Math.floor(t*FPS+1e-6)/FPS;
  if(t<INTRO7){introFinal(t,sx,epFrame);if(t>=4)dither(sx)}
  else if(t<INTRO7+D){drawEp(t-INTRO7,sx)}
  else{outroFinal(t-INTRO7-D,sx,epFrame,D)}
  present(sc,out)}
window.T=T;window.FPS=FPS;window.render=render;window.OUT_SIZE=[960,720];   // финал длинный — рендерим в 960x720, чтобы файл влез в GitHub
window.__ready=loadFonts();
if(!window.__RENDER_MODE){window.__ready.then(()=>{let st=null;const go=ts=>{if(st===null)st=ts;render(((ts-st)/1000)%T);requestAnimationFrame(go)};requestAnimationFrame(go);out.addEventListener('click',()=>st=null)})}
</script>
</body>
</html>
