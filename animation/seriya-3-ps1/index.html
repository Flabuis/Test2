<html lang="ru">
<head>

<title>Изба: серия 3 (PS1)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000}
  #out{position:absolute;inset:0;margin:auto;display:block;height:100vh;width:133.33vh;max-width:100vw;max-height:75vw;image-rendering:pixelated}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="out" width="960" height="720"></canvas>
<script type="module">
// Серия 3 «Окно». PS1-стиль (скилл low-poly-motion, PS1 variant): 320x240, дрожащие вершины,
// аффинные текстуры, плоские грани, туман, 15 fps, 15-бит цвет + дизеринг.
import * as THREE from 'three';
const T=60, FPS=15, RW=320, RH=240;

// ---------- утилиты ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b)=>mulberry((a*73856093)^(b*19349663))();
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3), eIn=k=>k*k*k, eInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const col=h=>new THREE.Color(h);

// ---------- рендерер ----------
const glr=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});
glr.setPixelRatio(1);glr.setSize(RW,RH,false);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(58,RW/RH,0.1,500);
const SNAP={value:new THREE.Vector2(RW/2,RH/2)};
function ps1(mat){mat.onBeforeCompile=s=>{s.uniforms.uSnap=SNAP;
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nuniform vec2 uSnap;\nvarying float vAffW;')
   .replace('#include <project_vertex>',`#include <project_vertex>
    vec4 sp=gl_Position; sp.xy=floor(sp.xy/sp.w*uSnap+0.5)/uSnap*sp.w; gl_Position=sp; vAffW=gl_Position.w;
    #ifdef USE_MAP
    vMapUv*=vAffW;
    #endif`);
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying float vAffW;')
   .replace('#include <map_fragment>',`#ifdef USE_MAP
    vec4 sampledDiffuseColor=texture2D(map,vMapUv/vAffW); diffuseColor*=sampledDiffuseColor;
    #endif`)};
  mat.customProgramCacheKey=()=>'ps1'+(mat.map?'m':'');return mat}
const M=(o={})=>ps1(new THREE.MeshLambertMaterial({flatShading:true,...o}));

// ---------- текстуры ----------
function tex(w,h,fn,rep=[1,1]){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);
  const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);t.colorSpace=THREE.SRGBColorSpace;return t}
function noise(g,w,h,pal,seed){const r=mulberry(seed);for(let y=0;y<h;y++)for(let x=0;x<w;x++){g.fillStyle=pal[Math.floor(r()*pal.length)];g.fillRect(x,y,1,1)}}
const TX={
  grass:tex(32,32,(g,w,h)=>noise(g,w,h,['#4a7536','#567f3e','#3f6830','#61884a'],1),[40,40]),
  bark:tex(16,32,(g,w,h)=>{noise(g,w,h,['#6b4a2e','#5a3d24','#7a5634'],3);g.fillStyle='rgba(40,25,10,.5)';for(let x=1;x<w;x+=4)g.fillRect(x,0,1,h)}),
  ring:tex(32,32,(g,w,h)=>{for(let y=0;y<h;y++)for(let x=0;x<w;x++){const d=Math.hypot(x-15.5,y-15.5);g.fillStyle=d>14.5?'#5a3d24':d>13?'#7a5634':(Math.floor(d/2.2)%2?'#d9b27a':'#c49a62');g.fillRect(x,y,1,1)}}),
  planks:tex(64,32,(g,w,h)=>{noise(g,w,h,['#a87c4f','#9c7246','#b48758'],4);g.fillStyle='rgba(50,30,15,.6)';for(let y=0;y<h;y+=8)g.fillRect(0,y,w,1);const r=mulberry(9);for(let y=0;y<h;y+=8)g.fillRect(r()*w|0,y,1,8)},[3,3]),
  pine:tex(16,16,(g,w,h)=>noise(g,w,h,['#2f5236','#28472e','#3a5f3f','#244028'],7)),
  pineFar:tex(16,16,(g,w,h)=>noise(g,w,h,['#4d6b55','#456250','#55735c'],8)),
  shirt:tex(16,16,(g,w,h)=>{noise(g,w,h,['#b8432f','#a83a28','#c04a34'],9);g.fillStyle='#e9d9a8';g.fillRect(9,0,1,7)}),
  pants:tex(8,8,(g,w,h)=>noise(g,w,h,['#3a3a40','#34343a','#40404a'],10)),
  skin:tex(8,8,(g,w,h)=>noise(g,w,h,['#e8b98f','#e0b088'],11)),
  hair:tex(8,8,(g,w,h)=>noise(g,w,h,['#5a3a22','#6a4428','#4e321d'],12)),
  face:tex(16,16,(g,w,h)=>{noise(g,w,h,['#e8b98f','#e0b088'],13);g.fillStyle='#5a3a22';g.fillRect(0,0,16,3);g.fillRect(3,5,4,1);g.fillRect(9,5,4,1);
    g.fillStyle='#1e1e1e';g.fillRect(4,7,2,2);g.fillRect(10,7,2,2);g.fillStyle='#c98f6a';g.fillRect(7,9,2,2)}),
  faceO:tex(16,16,(g,w,h)=>{noise(g,w,h,['#e8b98f','#e0b088'],13);g.fillStyle='#5a3a22';g.fillRect(0,0,16,3);g.fillRect(3,4,4,1);g.fillRect(9,4,4,1);
    g.fillStyle='#1e1e1e';g.fillRect(4,6,2,3);g.fillRect(10,6,2,3);g.fillStyle='#3a1a10';g.fillRect(6,11,4,4)}),
  beard:tex(8,8,(g,w,h)=>noise(g,w,h,['#7a4e2a','#6a4224','#855632'],14)),
  checker:tex(4,4,(g)=>{g.fillStyle='#1b2450';g.fillRect(0,0,4,4);g.fillStyle='#232e62';g.fillRect(0,0,2,2);g.fillRect(2,2,2,2)},[30,30]),
  metal:tex(8,8,(g,w,h)=>noise(g,w,h,['#7e848a','#8a9096','#727880'],15)),
  roof:tex(32,32,(g,w,h)=>{noise(g,w,h,['#7a5c3e','#6e5236','#86664a'],16);g.fillStyle='rgba(30,20,10,.5)';for(let x=0;x<w;x+=4)g.fillRect(x,0,1,h)},[3,1]),
  brick:tex(32,32,(g,w,h)=>{g.fillStyle='#b8b0a0';g.fillRect(0,0,w,h);const r=mulberry(17);for(let row=0;row<4;row++){const off=row%2?8:0;for(let x=-8;x<w;x+=16){g.fillStyle=['#a8432c','#b34b32','#9c3d28','#ab4630'][r()*4|0];g.fillRect(x+off+1,row*8+1,14,6)}}},[2,1]),
  concrete:tex(16,16,(g,w,h)=>noise(g,w,h,['#9a9a96','#8e8e8a','#a6a6a0','#84847f'],18),[2,1]),
  stone:tex(16,16,(g,w,h)=>noise(g,w,h,['#6f6f78','#62626a','#7a7a84'],19),[2,1]),
  dirt:tex(16,16,(g,w,h)=>noise(g,w,h,['#5a4330','#4e3a28','#654b36','#3f2f20'],20),[6,2]),
  basalt:tex(16,16,(g,w,h)=>noise(g,w,h,['#d8d2b0','#cfc8a2','#e0dabb'],21)),
};

// ---------- небо, свет ----------
const skyU={top:{value:col('#0a1030')},bot:{value:col('#1d2850')}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,12,8),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float k=clamp(normalize(vP).y*1.8+.05,0.,1.);gl_FragColor=vec4(mix(bot,top,k),1.);}'}));
scene.add(sky);
const starG=new THREE.BufferGeometry();{const r=mulberry(21),a=[];for(let i=0;i<260;i++){const th=r()*Math.PI*2,ph=.08+r()*1.3;a.push(Math.cos(th)*Math.cos(ph)*250,Math.sin(ph)*250,Math.sin(th)*Math.cos(ph)*250)}starG.setAttribute('position',new THREE.Float32BufferAttribute(a,3))}
const stars=new THREE.Points(starG,new THREE.PointsMaterial({color:0xf3ecdd,size:1.5,sizeAttenuation:false,transparent:true,fog:false}));scene.add(stars);
const moon=new THREE.Mesh(new THREE.IcosahedronGeometry(9,0),new THREE.MeshBasicMaterial({color:0xf4ebcf,fog:false}));moon.position.set(70,150,-180);scene.add(moon);
const amb=new THREE.AmbientLight(0xffffff,1);scene.add(amb);
const dir=new THREE.DirectionalLight(0xffffff,1);scene.add(dir,dir.target);
const fireL=new THREE.PointLight(0xff8a3a,0,14,1.4);scene.add(fireL);
const fireL2=new THREE.PointLight(0xff6a2a,0,26,1.2);scene.add(fireL2);
scene.fog=new THREE.Fog(0x000000,10,60);

// ---------- модели ----------
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
function makeAxe(s=1){const g=new THREE.Group();const h=new THREE.Mesh(new THREE.CylinderGeometry(.035,.04,.95,6),M({map:TX.bark}));h.position.y=.47;g.add(h);
  const mm=M({map:TX.metal});const head=box(.1,.17,.08,mm);head.position.set(.02,.88,0);g.add(head);const bl=box(.2,.24,.05,mm);bl.position.set(.16,.86,0);g.add(bl);g.scale.setScalar(s);return g}
function makeGuy(){const g=new THREE.Group(),mP=M({map:TX.pants}),mS=M({map:TX.shirt}),mSk=M({map:TX.skin}),mH=M({map:TX.hair}),mB=M({map:TX.beard});
  const legs=[];for(const s of[-1,1]){const lg=new THREE.Group();lg.position.set(s*.12,.88,0);const l=box(.18,.8,.2,mP);l.position.y=-.4;lg.add(l);const b=box(.22,.14,.3,M({color:0x2a1e16}));b.position.set(0,-.81,.03);lg.add(b);g.add(lg);legs.push(lg)}
  const tor=box(.56,.7,.32,mS);tor.position.y=1.2;g.add(tor);const belt=box(.58,.07,.34,M({color:0xe9c46a}));belt.position.y=.9;g.add(belt);
  const arms=[];for(const s of[-1,1]){const a=new THREE.Group();a.position.set(s*.37,1.5,0);const u=box(.16,.66,.18,mS);u.position.y=-.32;a.add(u);const hd=box(.13,.13,.13,mSk);hd.position.y=-.7;a.add(hd);g.add(a);arms.push(a)}
  const head=new THREE.Group();head.position.y=1.57;const fm=M({map:TX.face}),fo=M({map:TX.faceO});const hm=[mSk,mSk,mH,mSk,fm,mH];const hb=box(.38,.42,.38,hm);hb.position.y=.22;head.add(hb);
  const br=box(.4,.24,.12,mB);br.position.set(0,.08,.18);head.add(br);const cap=box(.42,.12,.42,mH);cap.position.y=.47;head.add(cap);g.add(head);
  g.userData={arms,legs,head,hb,fm,fo};return g}
function poseGuy(g,o={}){const U=g.userData;U.arms[0].rotation.set(o.ax0||0,0,o.az0??-.06);U.arms[1].rotation.set(o.ax1||0,0,o.az1??.06);
  U.legs[0].rotation.set(o.l0||0,0,0);U.legs[1].rotation.set(o.l1||0,0,0);U.head.rotation.set(o.hx||0,o.hy||0,0);U.hb.material[4]=o.shock?U.fo:U.fm}
const logMats=()=>[M({map:TX.bark}),M({map:TX.ring}),M({map:TX.ring})];
function makeLog(r,len,seg=8,mats){const geo=new THREE.CylinderGeometry(r,r,len,seg);geo.rotateZ(Math.PI/2);return new THREE.Mesh(geo,mats||logMats())}
function makePine(h,far){const g=new THREE.Group(),m=M({map:far?TX.pineFar:TX.pine});const tr=new THREE.Mesh(new THREE.CylinderGeometry(h*.03,h*.04,h*.25,5),M({map:TX.bark}));tr.position.y=h*.12;g.add(tr);
  [[.24,.42,.42],[.19,.36,.62],[.13,.3,.82]].forEach(([r,hh,y])=>{const c=new THREE.Mesh(new THREE.ConeGeometry(h*r,h*hh,6),m);c.position.y=h*y-h*.1;g.add(c)});return g}
// огонь: несколько конусов, мерцание от номера кадра
const fM1=new THREE.MeshBasicMaterial({color:0xff7a20,fog:false}),fM2=new THREE.MeshBasicMaterial({color:0xffd060,fog:false}),fM3=new THREE.MeshBasicMaterial({color:0xff4a10,fog:false});
function makeFlame(s=1,id=0){const g=new THREE.Group();[[.22,.7,fM3,0],[.17,.55,fM1,.05],[.1,.38,fM2,.1]].forEach(([r,h,m,y],i)=>{const c=new THREE.Mesh(new THREE.ConeGeometry(r,h,5),m);c.position.y=h/2+y;c.userData.i=i;g.add(c)});g.scale.setScalar(s);g.userData.id=id;return g}
function flick(f,t,grow=1){const fr=Math.floor(t*FPS);f.children.forEach(c=>{const h=hash(f.userData.id*7+c.userData.i,fr);c.scale.set(.8+h*.4,(.7+h*.6),.8+h*.4);c.rotation.y=h*3});f.scale.setScalar(f.userData.s0*grow)}
// камин из кирпича: венцы-кладки, топка, труба
function makeFireplace(o){const g=new THREE.Group(),bm=M({map:TX.brick}),parts=[];const W=1.6,D=.75,ch=.22;
  for(let i=0;i<6;i++){const m=box(W,ch-.005,D,bm);m.position.y=o.base+ch/2+i*ch;g.add(m);parts.push(m)}
  const top=o.base+6*ch;for(let i=0;i<Math.ceil((o.chimTop-top)/ch);i++){const m=box(.55,ch-.005,.55,bm);m.position.set(0,top+ch/2+i*ch,-.05);g.add(m);parts.push(m)}
  const hole=box(.9,.62,.06,M({color:0x140c08}));hole.position.set(0,o.base+.45,D/2+.01);g.add(hole);
  const fl=makeFlame(.9,o.id||1);fl.userData.s0=.9;fl.position.set(0,o.base+.18,.1);g.add(fl);
  g.userData={parts,hole,flame:fl,top};return g}
function buildFP(fp,k,drop=2){const p=fp.userData.parts,n=p.length;p.forEach((m,i)=>{const kk=clamp(k*n-i);m.visible=kk>0;if(m.userData.y0===undefined)m.userData.y0=m.position.y;m.position.y=m.userData.y0+drop*Math.pow(1-kk,2)});fp.userData.hole.visible=k*n>3}

// ---------- доп. текстуры ----------
TX.sand=tex(16,16,(g,w,h)=>noise(g,w,h,['#d9c07a','#cfb56e','#e2cb88'],30));
TX.ash=tex(16,16,(g,w,h)=>noise(g,w,h,['#8a8a8a','#7a7a7c','#9a9a98','#6c6c70'],31));
TX.lime=tex(16,16,(g,w,h)=>noise(g,w,h,['#eeeee6','#e2e2d8','#f6f6f0'],32));
TX.clay=tex(16,16,(g,w,h)=>noise(g,w,h,['#9a5a3a','#8c5034','#a66444'],33));
TX.moss=tex(16,16,(g,w,h)=>noise(g,w,h,['#5a7a3a','#4c6c30','#6a8a44'],34),[4,1]);
TX.night=tex(32,24,(g,w,h)=>{for(let y=0;y<h;y++){g.fillStyle=`rgb(${10+y*1.4|0},${16+y*1.8|0},${48+y*2.2|0})`;g.fillRect(0,y,w,1)}
  const r=mulberry(35);g.fillStyle='#e8e8f0';for(let i=0;i<14;i++)g.fillRect(r()*w|0,r()*12|0,1,1);g.fillStyle='#f4ebcf';g.fillRect(24,3,3,3);
  g.fillStyle='#b8c4d8';g.fillRect(0,20,w,4);g.fillStyle='#0c1a14';for(let i=0;i<7;i++){const x=2+i*5+(r()*2|0),hh=7+(r()*6|0);for(let k=0;k<hh;k++)g.fillRect(x-(k>>2),20-hh+k,1+(k>>1),1)}});
const hotMat=()=>M({color:0xff9a30,emissive:0xff5a10,emissiveIntensity:.9,side:THREE.DoubleSide});

// ---------- интерьер (как в конце серии 2) ----------
const room=new THREE.Group();scene.add(room);
const RZ=-3,RX=4,RH2=3.2;
{const fl=box(RX*2,.1,7.5,M({map:TX.planks}));fl.position.set(0,-.05,.5);room.add(fl);
 const ceil=box(RX*2+.4,.14,7.5,M({map:TX.planks}));ceil.position.set(0,RH2+.07,.5);room.add(ceil);
 for(const x of[-2.6,-.9,.9,2.6]){const b=box(.18,.22,7.4,M({map:TX.bark}));b.position.set(x,RH2-.11,.5);room.add(b)}
 const r=.18,step=.33;for(let i=0;i<10;i++){const l=makeLog(r,RX*2+.6,8);l.position.set(0,r+i*step,RZ);room.add(l)}
 for(const s of[-1,1])for(let i=0;i<10;i++){const l=makeLog(r,7.6,8);l.rotation.y=Math.PI/2;l.position.set(s*RX,r+i*step+step/2,.6);room.add(l)}}
const fpGood=makeFireplace({base:0,chimTop:RH2+.3,id:5});fpGood.position.set(0,0,RZ+.95);room.add(fpGood);buildFP(fpGood,1);
{const sc=box(2.6,3.0,.06,M({map:TX.basalt}));sc.position.set(0,1.5,RZ+.24);room.add(sc);
 const sh=box(1.8,.02,.8,M({map:TX.metal}));sh.position.set(0,.01,RZ+.95+.38+.4);room.add(sh);
 const rz=box(1.25,.42,1.25,M({map:TX.brick}));rz.position.set(0,RH2+.05,RZ+.9);room.add(rz)}
// окно в левой стене: дыра с видом на ночь
const WZ=.4,WY=1.7;const dk=new THREE.MeshBasicMaterial({color:0x0a0a10,fog:false});
const hole=box(.5,1.0,1.4,[new THREE.MeshBasicMaterial({map:TX.night,fog:false}),dk,dk,dk,dk,dk]);hole.position.set(-RX+.02,WY,WZ);room.add(hole);
const glassMat=()=>M({color:0xbfe6e0,transparent:true,opacity:.35,emissive:0x406060,emissiveIntensity:.4});
const winFrame=new THREE.Group();{const wm=M({map:TX.planks});
  for(const y of[-.5,0,.5]){const b=box(.08,.07,1.5,wm);b.position.set(0,y,0);winFrame.add(b)}
  for(const z of[-.7,0,.7]){const b=box(.08,1.07,.07,wm);b.position.set(0,0,z);winFrame.add(b)}
  const gl=box(.02,1.0,1.4,glassMat());gl.position.x=-.02;winFrame.add(gl);
  const mm=M({map:TX.moss});for(const y of[-.56,.56]){const b=box(.1,.06,1.62,mm);b.position.set(-.01,y,0);winFrame.add(b)}for(const z of[-.78,.78]){const b=box(.1,1.16,.06,mm);b.position.set(-.01,0,z);winFrame.add(b)}
  const glint=box(.01,.5,.05,new THREE.MeshBasicMaterial({color:0xffc070,fog:false}));glint.position.set(.02,.1,.3);glint.rotation.x=.5;winFrame.add(glint)}
winFrame.position.set(-RX+.3,WY,WZ);room.add(winFrame);
const snowM=new THREE.MeshBasicMaterial({color:0xf0f4ff,fog:false});
const snowR=[];for(let i=0;i<46;i++){const s=box(.045,.045,.045,snowM);room.add(s);snowR.push(s)}
const guyIn=makeGuy();room.add(guyIn);
const bucket=new THREE.Group();{const b=new THREE.Mesh(new THREE.CylinderGeometry(.17,.13,.28,7,1,true),M({map:TX.planks,side:THREE.DoubleSide}));bucket.add(b);const s=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.02,7),M({map:TX.sand}));s.position.y=.1;bucket.add(s);bucket.userData.s=s}
bucket.position.set(0,1.02,.5);guyIn.add(bucket);
const sandPile=new THREE.Mesh(new THREE.ConeGeometry(.42,.4,6),M({map:TX.sand}));sandPile.position.set(0,.2,RZ+.95+.55);room.add(sandPile);
const sandFall=box(.1,.9,.1,M({map:TX.sand}));room.add(sandFall);

// ---------- «справка» ----------
const voidW=new THREE.Group();scene.add(voidW);
{const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),M({map:TX.checker}));floor.rotation.x=-Math.PI/2;voidW.add(floor)}
const TY=.8;const table=box(5,TY,2.2,M({map:TX.stone}));table.position.y=TY/2;voidW.add(table);
// 1. состав
const g1=new THREE.Group();voidW.add(g1);
