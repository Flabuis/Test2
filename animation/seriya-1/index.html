<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Изба: серия 1</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=PT+Serif:ital,wght@0,700;1,700&family=PT+Mono&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#111}
  canvas{position:absolute;inset:0;margin:auto;display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Серия 1: «Дом до темноты». Стиль: Vox-коллаж (скиллы explainer-documentary, vox-collage-design,
// vox-after-effects-recipes): бумага, вырезки с белым кантом, красный маркер, 12 fps, boil 6 fps.
const W = 1920, H = 1080, FPS = 12, T = 57;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const C = { paper:'#EFE6D2', card:'#F7F1E3', ink:'#1E1E1E', red:'#C8382E', yel:'#F2C14E',
  wood:'#B9824A', woodD:'#8A5A2E', woodL:'#D9B27A', bark:'#6B4423', cream:'#F3ECDD' };
const F = { cond:'"Oswald", sans-serif', serif:'"PT Serif", serif', mono:'"PT Mono", monospace' };

// ---------- утилиты ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b){return mulberry((a*73856093)^(b*19349663))()}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3);
const eIn=k=>k*k*k;
const eInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
let BF=0; // кадр «кипения» (6 fps)
const jit=(id,a)=>[(hash(id,BF)-.5)*2*a,(hash(id+999,BF)-.5)*2*a];
const jr=(id,a)=>(hash(id+555,BF)-.5)*2*a;
function hx(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function mix(a,b,k){const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],clamp(k)))).join(',')})`}
function mix3(a,b,c,k){return k<.5?mix(a,b,k*2):mix(b,c,(k-.5)*2)}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function mk(w=W,h=H){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

// ---------- текстуры ----------
const paperTex=(()=>{const c=mk(W+80,H+80),g=c.getContext('2d'),r=mulberry(7);
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  for(let i=0;i<70;i++){const x=r()*c.width,y=r()*c.height,rad=100+r()*420,a=.03+r()*.05;
    const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,`rgba(120,95,60,${a})`);gr.addColorStop(1,'rgba(120,95,60,0)');
    g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2)}
  for(let i=0;i<9000;i++){const x=r()*c.width,y=r()*c.height,l=4+r()*18,a=r()*Math.PI;
    g.strokeStyle=`rgba(90,70,40,${.04+r()*.07})`;g.lineWidth=.6+r()*.8;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  for(let i=0;i<2500;i++){g.fillStyle=`rgba(60,45,25,${.1+r()*.25})`;const s=r()*2.2;g.fillRect(r()*c.width,r()*c.height,s,s)}
  const v=g.createRadialGradient(c.width/2,c.height/2,H*.35,c.width/2,c.height/2,H*1.05);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(70,50,30,.38)');g.fillStyle=v;g.fillRect(0,0,c.width,c.height);
  return c})();
const GRAIN=[0,1,2,3].map(s=>{const c=mk(960,540),g=c.getContext('2d'),d=g.createImageData(960,540),r=mulberry(100+s);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  g.putImageData(d,0,0);return c});

// ---------- вырезки (белый бумажный кант + тень) ----------
function cutout(w,h,draw,border=9){const a=mk(w+border*4,h+border*4),g=a.getContext('2d');g.translate(border*2,border*2);draw(g);
  const m=mk(a.width,a.height),mg=m.getContext('2d');mg.drawImage(a,0,0);mg.globalCompositeOperation='source-in';mg.fillStyle='#FBF8F0';mg.fillRect(0,0,m.width,m.height);
  const s=mk(a.width,a.height),sg=s.getContext('2d');
  for(let k=0;k<20;k++){const an=k/20*Math.PI*2;sg.drawImage(m,Math.cos(an)*border,Math.sin(an)*border)}
  sg.drawImage(a,0,0);return{c:s,o:border*2}}
function drawCut(cu,x,y,sc=1,rot=0,ax=0,ay=0,shadow=true){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  if(shadow){ctx.shadowColor='rgba(30,20,10,.38)';ctx.shadowBlur=16;ctx.shadowOffsetX=7;ctx.shadowOffsetY=9}
  ctx.drawImage(cu.c,-cu.o-ax,-cu.o-ay);ctx.restore()}

function guyDraw(g,axe){
  const rr=(x,y,w,h,r,c)=>{g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()};
  if(axe){ // топор в правой руке, обухом вниз
    g.save();g.translate(168,270);g.rotate(-0.12);rr(-6,0,13,120,6,'#8A5A2E');
    g.fillStyle='#6E7378';g.beginPath();g.moveTo(-10,104);g.lineTo(14,104);g.lineTo(46,92);g.lineTo(52,140);g.lineTo(14,128);g.lineTo(-10,128);g.closePath();g.fill();
    g.fillStyle='#C9CDD0';g.beginPath();g.moveTo(44,92);g.lineTo(52,140);g.lineTo(46,138);g.lineTo(39,94);g.closePath();g.fill();g.restore()}
  rr(80,270,28,125,6,'#3A3A40');rr(114,270,28,125,6,'#3A3A40');
  rr(70,382,44,34,10,'#2A1E16');rr(110,382,44,34,10,'#2A1E16');
  g.fillStyle='#B8432F';g.beginPath();g.moveTo(68,140);g.lineTo(154,140);g.lineTo(164,292);g.lineTo(58,292);g.closePath();g.fill();
  g.strokeStyle='#E9D9A8';g.lineWidth=5;g.beginPath();g.moveTo(126,146);g.lineTo(126,205);g.stroke();
  g.fillStyle='#E9C46A';g.fillRect(60,244,102,13);
  rr(40,150,28,122,13,'#A23A28');rr(154,150,28,122,13,'#A23A28');
  g.fillStyle='#E8B98F';g.beginPath();g.arc(54,274,14,0,7);g.fill();g.beginPath();g.arc(168,274,14,0,7);g.fill();
  g.beginPath();g.arc(111,98,43,0,7);g.fill();
  g.fillStyle='#5A3A22';g.beginPath();g.arc(111,92,45,Math.PI*1.02,Math.PI*1.98);g.lineTo(152,80);g.lineTo(70,80);g.closePath();g.fill();
  g.fillStyle='#7A4E2A';g.beginPath();g.moveTo(70,104);g.quadraticCurveTo(80,178,111,178);g.quadraticCurveTo(142,178,152,104);g.quadraticCurveTo(130,128,111,124);g.quadraticCurveTo(92,128,70,104);g.fill();
  g.fillStyle='#1E1E1E';g.beginPath();g.arc(97,96,4.5,0,7);g.fill();g.beginPath();g.arc(125,96,4.5,0,7);g.fill();
  g.strokeStyle='#5A3A22';g.lineWidth=4;g.beginPath();g.moveTo(89,86);g.lineTo(103,88);g.moveTo(119,88);g.lineTo(133,86);g.stroke();
}
const GUY=cutout(240,420,g=>guyDraw(g,false));
const GUYAXE=cutout(240,420,g=>guyDraw(g,true));
const AXE=cutout(420,200,g=>{
  g.fillStyle='#8A5A2E';g.beginPath();g.moveTo(10,92);g.quadraticCurveTo(200,70,372,84);g.lineTo(372,108);g.quadraticCurveTo(200,96,14,114);g.closePath();g.fill();
  g.strokeStyle='rgba(60,35,15,.5)';g.lineWidth=2;g.beginPath();g.moveTo(40,100);g.quadraticCurveTo(200,84,360,94);g.stroke();
  g.fillStyle='#6E7378';g.beginPath();g.moveTo(350,52);g.lineTo(398,52);g.lineTo(398,110);g.lineTo(412,190);g.quadraticCurveTo(360,200,318,184);g.lineTo(350,110);g.closePath();g.fill();
  g.fillStyle='#C9CDD0';g.beginPath();g.moveTo(318,184);g.quadraticCurveTo(360,200,412,190);g.lineTo(408,172);g.quadraticCurveTo(362,180,326,168);g.closePath();g.fill();
  g.strokeStyle='#1E1E1E';g.lineWidth=3;g.beginPath();g.moveTo(350,52);g.lineTo(398,52);g.lineTo(398,110);g.lineTo(412,190);g.quadraticCurveTo(360,200,318,184);g.lineTo(350,110);g.closePath();g.stroke();
});

// ---------- лес (статичные слои) ----------
function tornPoly(g,pts,fill){g.fillStyle=fill;g.beginPath();g.moveTo(...pts[0]);for(const p of pts)g.lineTo(...p);g.closePath();g.fill()}
function fir(g,x,base,h,col,r){const w=h*.44;g.fillStyle=col;g.fillRect(x-h*.03,base-h*.13,h*.06,h*.13);
  for(let i=0;i<4;i++){const ty=base-h*.1-i*h*.19,tw=w*(1-i*.2),top=base-h;
    g.beginPath();g.moveTo(x-tw/2,ty);for(let j=1;j<=6;j++)g.lineTo(x-tw/2+tw*j/6,ty+(j%2?5+r()*6:-2));
    g.lineTo(x+(r()-.5)*4,i===3?top:ty-h*.36);g.closePath();g.fill()}}
const FOREST=(()=>{const L={},r=mulberry(11);let c,g;
  c=mk();g=c.getContext('2d');const fp=[[0,H]];for(let x=0;x<=W;x+=40)fp.push([x,640+Math.sin(x*.004)*40+r()*14]);fp.push([W,H]);tornPoly(g,fp,'#A7B6A2');
  for(let i=0;i<46;i++)fir(g,r()*W,705+r()*20,110+r()*90,'#8AA190',r);L.far=c;
  c=mk();g=c.getContext('2d');for(let i=0;i<24;i++)fir(g,r()*W,815+r()*15,230+r()*160,'#5B7A63',r);L.mid=c;
  c=mk();g=c.getContext('2d');const gp=[[0,H]];for(let x=0;x<=W;x+=24)gp.push([x,822+Math.sin(x*.01)*6+r()*10]);gp.push([W,H]);tornPoly(g,gp,'#7D6C45');
  g.strokeStyle='#5E5332';g.lineWidth=3;for(let i=0;i<140;i++){const x=r()*W,y=836+r()*240;g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y-13);g.moveTo(x,y);g.lineTo(x+4,y-15);g.stroke()}L.ground=c;
  c=mk();g=c.getContext('2d');[[70,990,860],[260,975,640],[1700,980,720],[1875,1000,880],[430,1010,400],[1520,1015,380]].forEach(([x,b,h])=>fir(g,x,b,h,'#2C4636',r));L.near=c;
  const sr=mulberry(5);L.stars=Array.from({length:140},()=>[sr()*W,sr()*560,.8+sr()*2.2,sr()*1000|0]);
  return L})();

function forestBase(n,sunY,moonY,sunCol){
  const gr=ctx.createLinearGradient(0,0,0,820);
  gr.addColorStop(0,mix3('#C9D8D4','#7A5C7E','#0E1730',n));gr.addColorStop(1,mix3('#F2E7CB','#EA9A57','#26345A',n));
  ctx.fillStyle=gr;ctx.fillRect(-200,-200,W+400,H+400);
  if(n>.55){const a=P(n,.55,1);for(const [x,y,s,id] of FOREST.stars){ctx.fillStyle=`rgba(243,236,221,${a*(.45+.55*hash(id,BF))})`;ctx.fillRect(x,y,s,s)}}
  if(sunY<1000){const g=ctx.createRadialGradient(1450,sunY,40,1450,sunY,260);g.addColorStop(0,'rgba(246,208,122,.45)');g.addColorStop(1,'rgba(246,208,122,0)');ctx.fillStyle=g;ctx.fillRect(1100,sunY-300,700,600);ctx.fillStyle=sunCol;circle(1450,sunY,88)}
  if(moonY<1000){const g=ctx.createRadialGradient(1560,moonY,30,1560,moonY,220);g.addColorStop(0,'rgba(244,235,207,.35)');g.addColorStop(1,'rgba(244,235,207,0)');ctx.fillStyle=g;ctx.fillRect(1300,moonY-260,520,520);
    ctx.fillStyle='#F4EBCF';circle(1560,moonY,60);ctx.fillStyle='rgba(180,170,140,.35)';circle(1542,moonY-14,11);circle(1576,moonY+16,8);circle(1574,moonY-22,5)}
  ctx.filter=`brightness(${1-.72*n}) saturate(${1-.5*n})`;
  let [x,y]=jit(1,1.5);ctx.drawImage(FOREST.far,x,y);[x,y]=jit(2,2);ctx.drawImage(FOREST.mid,x,y);[x,y]=jit(3,1.5);ctx.drawImage(FOREST.ground,x,y);
  ctx.filter='none'}
function forestFront(n){ctx.filter=`brightness(${1-.75*n}) saturate(${1-.5*n})`;const [x,y]=jit(4,3);ctx.drawImage(FOREST.near,x,y);ctx.filter='none'}

// ---------- рисованные элементы ----------
function strokePart(pts,p,col,lw,dash){if(p<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';if(dash)ctx.setLineDash(dash);
  ctx.beginPath();const m=(pts.length-1)*clamp(p),fi=Math.floor(m);ctx.moveTo(...pts[0]);for(let i=1;i<=fi;i++)ctx.lineTo(...pts[i]);
  const f=m-fi;if(f>0&&fi+1<pts.length){const a=pts[fi],b=pts[fi+1];ctx.lineTo(lerp(a[0],b[0],f),lerp(a[1],b[1],f))}ctx.stroke();ctx.restore()}
function wobLine(x1,y1,x2,y2,n,wob,id){const r=mulberry(id),pts=[];for(let i=0;i<=n;i++){const k=i/n;pts.push([lerp(x1,x2,k)+(r()-.5)*wob,lerp(y1,y2,k)+(r()-.5)*wob])}return pts}
function markerEllipse(cx,cy,rx,ry,p,id,col=C.red,lw=10){const r=mulberry(id),ph=r()*6,pts=[];for(let i=0;i<=70;i++){const a=ph+i/70*1.12*Math.PI*2,w=1+Math.sin(a*3+id)*.03+i/70*.07;pts.push([cx+Math.cos(a)*rx*w,cy+Math.sin(a)*ry*w])}
  const [jx,jy]=jit(id,1.5);ctx.save();ctx.translate(jx,jy);strokePart(pts,p,col,lw);ctx.restore()}
function markX(cx,cy,s,p,id){strokePart(wobLine(cx-s,cy-s*.8,cx+s,cy+s*.8,20,6,id),P(p,0,.5),C.red,16);strokePart(wobLine(cx+s,cy-s*.8,cx-s,cy+s*.8,20,6,id+1),P(p,.5,1),C.red,16)}
function arrow(x1,y1,x2,y2,p,id,col=C.ink,lw=6,bend=-40){if(p<=0)return;const pts=[];const mx=(x1+x2)/2,my=(y1+y2)/2+bend;
  for(let i=0;i<=30;i++){const k=i/30;pts.push([(1-k)*(1-k)*x1+2*(1-k)*k*mx+k*k*x2,(1-k)*(1-k)*y1+2*(1-k)*k*my+k*k*y2])}
  strokePart(pts,p,col,lw);if(p>.9){const a=Math.atan2(y2-pts[27][1],x2-pts[27][0]);strokePart([[x2-Math.cos(a-.5)*26,y2-Math.sin(a-.5)*26],[x2,y2],[x2-Math.cos(a+.5)*26,y2-Math.sin(a+.5)*26]],1,col,lw)}}
function leader(x1,y1,x2,y2,p){if(p<=0)return;ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.setLineDash([12,9]);ctx.lineDashOffset=-BF*3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p));ctx.stroke();ctx.restore()}
function roughRect(x,y,w,h,col,id){const r=mulberry(id),pts=[],s=8;const pu=(px,py)=>pts.push([px+(r()-.5)*5+jr(id*7+pts.length,1),py+(r()-.5)*5]);
  for(let i=0;i<s;i++)pu(x+w*i/s,y);for(let i=0;i<s;i++)pu(x+w,y+h*i/s);for(let i=0;i<s;i++)pu(x+w-w*i/s,y+h);for(let i=0;i<s;i++)pu(x,y+h-h*i/s);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(...pts[0]);pts.forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fill()}
function popText(txt,x,y,font,col,p,align='center',rot=0){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(rot+jr(x|0,.01));const s=eBack(clamp(p));ctx.scale(s,s);
  ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(txt,0,0);ctx.restore()}
function boxLabel(txt,x,y,size,p,bg=C.ink,fg=C.yel,id=3,rot=0){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(rot+jr(id,.008));const s=eBack(clamp(p));ctx.scale(s,s);
  ctx.font=`700 ${size}px ${F.cond}`;const w=ctx.measureText(txt).width+size*.9,h=size*1.45;roughRect(-w/2,-h/2,w,h,bg,id);
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,0,size*.05);ctx.restore()}
function typeText(txt,x,y,font,col,t0,t,cps=26,align='left',cursor=true){const n=Math.floor((t-t0)*cps);if(n<0)return;const s=txt.slice(0,n);
  ctx.save();ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);
  const done=n>=txt.length&&(t-t0)*cps>txt.length+30;
  if(cursor&&!done&&Math.floor(t*2.5)%2===0){const w=ctx.measureText(s).width,fs=parseInt(font.match(/(\d+)px/)[1]);const cx=align==='left'?x+w+6:x+w/2+6;ctx.fillRect(cx,y-fs*.78,fs*.07,fs*.9)}
  ctx.restore()}
function chips(x,y,t0,t,id,n=10){const k=t-t0;if(k<0||k>.7)return;const r=mulberry(id);
  for(let i=0;i<n;i++){const vx=(r()-.5)*900,vy=-300-r()*500;ctx.save();ctx.translate(x+vx*k,y+vy*k+1500*k*k);ctx.rotate(r()*6+k*12);ctx.fillStyle=r()<.5?C.woodL:C.wood;ctx.fillRect(-8,-3,16,6);ctx.restore()}}

// ---------- дерево ----------
function logH(x1,x2,yc,r,id){ctx.save();const g=ctx.createLinearGradient(0,yc-r,0,yc+r);g.addColorStop(0,'#D6A46C');g.addColorStop(.45,C.wood);g.addColorStop(1,'#7A4E28');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x1,yc-r,x2-x1,2*r,r*.7);ctx.fill();
  const rr=mulberry(id);ctx.strokeStyle='rgba(70,40,20,.45)';ctx.lineWidth=2;
  for(let i=0;i<6;i++){const yy=yc-r*.6+rr()*r*1.2,xa=x1+rr()*(x2-x1)*.6;ctx.beginPath();ctx.moveTo(xa,yy);ctx.lineTo(xa+60+rr()*220,yy+(rr()-.5)*4);ctx.stroke()}
  ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x1,yc-r,x2-x1,2*r,r*.7);ctx.stroke();ctx.restore()}
function logEnd(x,y,r,id){ctx.save();ctx.fillStyle=C.bark;circle(x,y,r);ctx.fillStyle=C.woodL;circle(x,y,r*.86);
  const rr=mulberry(id);ctx.strokeStyle='rgba(139,90,46,.7)';ctx.lineWidth=Math.max(1.5,r*.025);const ox=(rr()-.5)*r*.18,oy=(rr()-.5)*r*.18;
  [.16,.32,.48,.64,.78].forEach(k=>{ctx.beginPath();ctx.arc(x+ox*(1-k),y+oy*(1-k),r*k,0,7);ctx.stroke()});
  ctx.fillStyle='rgba(110,70,35,.85)';circle(x+ox,y+oy,Math.max(2,r*.05));
  ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.restore()}
function bar(x,y,w,h,id){ctx.fillStyle='#DDB57E';ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(120,80,40,.18)';ctx.fillRect(x,y+h*.68,w,h*.32);
  const rr=mulberry(id);ctx.strokeStyle='rgba(120,80,40,.45)';ctx.lineWidth=1.5;for(let i=0;i<3;i++){const yy=y+5+rr()*(h-10);ctx.beginPath();ctx.moveTo(x+rr()*40,yy);ctx.lineTo(x+w-rr()*40,yy);ctx.stroke()}
  ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.strokeRect(x,y,w,h)}

// ---------- камера, фон, переходы ----------
function cam(t,t0,t1,push=.05){const s=1+push*P(t,t0,t1),[x,y]=jit(5,3);ctx.translate(W/2+x,H/2+y);ctx.scale(s,s);ctx.translate(-W/2,-H/2)}

  ['В средневековье строили не из брусков, а из *брёвен*.',21.8,25.4],['Пилить бревно вдоль вручную — это *неделя мата*',25.6,28.8],['и одна *сломанная пила*.',28.9,31.0],
  ['Поэтому рубили *сруб* из круглых брёвен.',31.8,36.6],['А главный инструмент — *топор*.',36.9,41.0],
  ['Даже доски не *пилили*:',41.9,44.2],['их кололи *клиньями*',44.3,46.9],['и стёсывали *топором*.',47.0,50.2]];
function caption(s,t0,t1,t){if(t<t0||t>t1+.2)return;const runs=[];s.split('*').forEach((x,i)=>{if(x)runs.push({x,em:i%2===1})});const fs=46;
  const font=r=>`${r.em?'italic ':''}700 ${fs}px ${F.serif}`;let total=0;const ws=runs.map(r=>{ctx.font=font(r);const w=ctx.measureText(r.x).width;total+=w;return w});
  const sc=eBack(P(t,t0,t0+.25))*(1-P(t,t1,t1+.18));if(sc<=0)return;const bw=total+60,bh=fs+36;
  ctx.save();ctx.translate(W/2,966);ctx.rotate(-.006+jr(31,.004));ctx.scale(sc,sc);roughRect(-bw/2,-bh/2,bw,bh,C.ink,41);
  let n=Math.floor((t-t0-.12)*32),x=-total/2;ctx.textBaseline='middle';ctx.textAlign='left';
  runs.forEach((r,i)=>{const vis=r.x.slice(0,Math.max(0,n));n-=r.x.length;ctx.font=font(r);ctx.fillStyle=r.em?C.yel:C.cream;ctx.fillText(vis,x,3);x+=ws[i]});ctx.restore()}

// ---------- оболочка канала и финишный стек ----------
function shell(t){const dark=t<13.4||t>=50.9;ctx.save();ctx.font=`22px ${F.mono}`;ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.fillStyle=dark?'rgba(243,236,221,.8)':'rgba(30,30,30,.7)';ctx.fillText('ИЗБА · СЕРИЯ 1',W-60,56);ctx.fillStyle=C.red;circle(W-60-ctx.measureText('ИЗБА · СЕРИЯ 1').width-18,56,7);
  ctx.fillStyle='rgba(30,30,30,.25)';ctx.fillRect(0,H-8,W,8);ctx.fillStyle=C.yel;ctx.fillRect(0,H-8,W*t/T,8);ctx.restore()}
function finishing(t){ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.9;const [px,py]=jit(9,6);ctx.drawImage(paperTex,-40+px,-40+py);ctx.restore();
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.09;ctx.drawImage(GRAIN[Math.floor(t*12)%4],0,0,W,H);ctx.restore();
  ctx.fillStyle=`rgba(0,0,0,${hash(3,BF)*.035})`;ctx.fillRect(0,0,W,H)}

function render(t){t=Math.floor(t*FPS+1e-6)/FPS;BF=Math.floor(t*6);ctx.setTransform(1,0,0,1,0,0);ctx.filter='none';ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const [sx,sy]=shakeAt(t);ctx.save();ctx.translate(sx,sy);
  if(t<13.4)S1(t);
  else if(t<21.6){paperBG();S2(t)}
  else if(t<31.6){paperBG();S3(t)}
  else if(t<41.2){paperBG();S4(t)}
  else if(t<41.8){const e=eInOut(P(t,41.2,41.8));paperBG();ctx.save();ctx.translate(-W*e,0);S4(t);ctx.restore();ctx.save();ctx.translate(W*(1-e),0);S5(t);ctx.restore()}
  else if(t<50.9){paperBG();S5(t)}
  else S6(t);
  ctx.restore();
  for(const [s,a,b] of CAPS)caption(s,a,b,t);
  shell(t);finishing(t)}

// Просмотр в браузере: крутится по кругу, клик — заново.
if(!window.__RENDER_MODE){let start=null;const go=ts=>{if(start===null)start=ts;render(((ts-start)/1000)%T);requestAnimationFrame(go)};
