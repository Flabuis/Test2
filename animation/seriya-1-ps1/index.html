<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Изба: серия 1 (PS1)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000}
  #out{position:absolute;inset:0;margin:auto;display:block;height:100vh;width:133.33vh;max-width:100vw;max-height:75vw;image-rendering:pixelated}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="out" width="960" height="720"></canvas>
<script type="module">
// Серия 1 «Дом до темноты», PS1-версия. Скилл low-poly-motion (PS1 variant): 320x240, без AA,
// привязка вершин к сетке (дрожание), аффинные текстуры, плоские грани, туман, 15 fps, 15-бит цвет + дизеринг.
import * as THREE from 'three';
const T=58, FPS=15, RW=320, RH=240;

// ---------- утилиты ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b)=>mulberry((a*73856093)^(b*19349663))();
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3), eIn=k=>k*k*k, eInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const col=h=>new THREE.Color(h);
const mixC=(a,b,k)=>col(a).lerp(col(b),clamp(k));
const mix3=(a,b,c,k)=>k<.5?mixC(a,b,k*2):mixC(b,c,(k-.5)*2);

// ---------- рендерер ----------
const glr=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});
glr.setPixelRatio(1);glr.setSize(RW,RH,false);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,RW/RH,0.1,500);
const SNAP={value:new THREE.Vector2(RW/2,RH/2)};

function ps1(mat){mat.onBeforeCompile=s=>{s.uniforms.uSnap=SNAP;
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nuniform vec2 uSnap;\nvarying float vAffW;')
   .replace('#include <project_vertex>',`#include <project_vertex>
    vec4 sp=gl_Position; sp.xy=floor(sp.xy/sp.w*uSnap+0.5)/uSnap*sp.w; gl_Position=sp; vAffW=gl_Position.w;
    #ifdef USE_MAP
    vMapUv*=vAffW;
    #endif`);
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying float vAffW;')
   .replace('#include <map_fragment>',`#ifdef USE_MAP
    vec4 sampledDiffuseColor=texture2D(map,vMapUv/vAffW); diffuseColor*=sampledDiffuseColor;
    #endif`)};
  mat.customProgramCacheKey=()=>'ps1'+(mat.map?'m':'');return mat}
const M=(o={})=>ps1(new THREE.MeshLambertMaterial({flatShading:true,...o}));

// ---------- текстуры (маленькие, nearest) ----------
function tex(w,h,fn,rep=[1,1]){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);
  const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);t.colorSpace=THREE.SRGBColorSpace;return t}
function noise(g,w,h,pal,seed){const r=mulberry(seed);for(let y=0;y<h;y++)for(let x=0;x<w;x++){g.fillStyle=pal[Math.floor(r()*pal.length)];g.fillRect(x,y,1,1)}}
const TX={
  grass:tex(32,32,(g,w,h)=>{noise(g,w,h,['#4a7536','#567f3e','#3f6830','#61884a','#4a7536'],1);const r=mulberry(2);for(let i=0;i<20;i++){g.fillStyle='#6b5a3a';g.fillRect(r()*w|0,r()*h|0,1,1)}},[40,40]),
  bark:tex(16,32,(g,w,h)=>{noise(g,w,h,['#6b4a2e','#5a3d24','#7a5634'],3);g.fillStyle='rgba(40,25,10,.5)';for(let x=1;x<w;x+=4)g.fillRect(x,0,1,h)}),
  ring:tex(32,32,(g,w,h)=>{for(let y=0;y<h;y++)for(let x=0;x<w;x++){const d=Math.hypot(x-15.5,y-15.5);g.fillStyle=d>14.5?'#5a3d24':d>13?'#7a5634':(Math.floor(d/2.2)%2?'#d9b27a':'#c49a62');g.fillRect(x,y,1,1)}g.fillStyle='#8a5a2e';g.fillRect(15,15,2,2)}),
  planed:tex(64,16,(g,w,h)=>{noise(g,w,h,['#dcb47c','#d6ad74','#e0ba84'],4);g.fillStyle='rgba(140,95,50,.45)';const r=mulberry(5);for(let i=0;i<5;i++){const y=r()*h|0;g.fillRect(0,y,w,1)}}),
  split:tex(64,16,(g,w,h)=>{noise(g,w,h,['#d9b27a','#c99f66','#e0bb86','#b98a52'],6)}),
  pine:tex(16,16,(g,w,h)=>noise(g,w,h,['#2f5236','#28472e','#3a5f3f','#244028'],7)),
  pineFar:tex(16,16,(g,w,h)=>noise(g,w,h,['#4d6b55','#456250','#55735c'],8)),
  shirt:tex(16,16,(g,w,h)=>{noise(g,w,h,['#b8432f','#a83a28','#c04a34'],9);g.fillStyle='#e9d9a8';g.fillRect(9,0,1,7)}),
  pants:tex(8,8,(g,w,h)=>noise(g,w,h,['#3a3a40','#34343a','#40404a'],10)),
  skin:tex(8,8,(g,w,h)=>noise(g,w,h,['#e8b98f','#e0b088'],11)),
  hair:tex(8,8,(g,w,h)=>noise(g,w,h,['#5a3a22','#6a4428','#4e321d'],12)),
  face:tex(16,16,(g,w,h)=>{noise(g,w,h,['#e8b98f','#e0b088'],13);g.fillStyle='#5a3a22';g.fillRect(0,0,16,3);g.fillRect(3,5,4,1);g.fillRect(9,5,4,1);
    g.fillStyle='#1e1e1e';g.fillRect(4,7,2,2);g.fillRect(10,7,2,2);g.fillStyle='#c98f6a';g.fillRect(7,9,2,2)}),
  beard:tex(8,8,(g,w,h)=>noise(g,w,h,['#7a4e2a','#6a4224','#855632'],14)),
  checker:tex(4,4,(g)=>{g.fillStyle='#1b2450';g.fillRect(0,0,4,4);g.fillStyle='#232e62';g.fillRect(0,0,2,2);g.fillRect(2,2,2,2)},[30,30]),
  metal:tex(8,8,(g,w,h)=>noise(g,w,h,['#7e848a','#8a9096','#727880'],15)),
  roof:tex(32,32,(g,w,h)=>{noise(g,w,h,['#7a5c3e','#6e5236','#86664a'],16);g.fillStyle='rgba(30,20,10,.5)';for(let x=0;x<w;x+=4)g.fillRect(x,0,1,h)},[3,1]),
  saw:tex(64,16,(g,w,h)=>{g.clearRect(0,0,w,h);noise(g,w,11,['#9aa1a6','#a8afb4','#8e959a'],17);g.fillStyle='#9aa1a6';for(let x=0;x<w;x+=4){g.beginPath();g.moveTo(x,11);g.lineTo(x+4,11);g.lineTo(x+2,16);g.fill()}}),
};

// ---------- небо, звёзды, светила ----------
const skyU={top:{value:col('#7fb0d8')},bot:{value:col('#f2dcae')}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,12,8),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float k=clamp(normalize(vP).y*1.8+.05,0.,1.);gl_FragColor=vec4(mix(bot,top,k),1.);}'}));
scene.add(sky);
const starG=new THREE.BufferGeometry();{const r=mulberry(21),a=[];for(let i=0;i<260;i++){const th=r()*Math.PI*2,ph=.08+r()*1.3;a.push(Math.cos(th)*Math.cos(ph)*250,Math.sin(ph)*250,Math.sin(th)*Math.cos(ph)*250)}starG.setAttribute('position',new THREE.Float32BufferAttribute(a,3))}
const stars=new THREE.Points(starG,new THREE.PointsMaterial({color:0xf3ecdd,size:1.5,sizeAttenuation:false,transparent:true,fog:false}));scene.add(stars);
const sun=new THREE.Mesh(new THREE.IcosahedronGeometry(14,0),new THREE.MeshBasicMaterial({color:0xf6c060,fog:false}));scene.add(sun);
const moon=new THREE.Mesh(new THREE.IcosahedronGeometry(9,0),new THREE.MeshBasicMaterial({color:0xf4ebcf,fog:false}));scene.add(moon);
const amb=new THREE.AmbientLight(0xffffff,1);scene.add(amb);
const dir=new THREE.DirectionalLight(0xffffff,2);scene.add(dir,dir.target);
const fire=new THREE.PointLight(0xff8a3a,0,12,1.5);scene.add(fire);
scene.fog=new THREE.Fog(0x000000,10,60);

// ---------- модели ----------
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
function makeGuy(withAxe){const g=new THREE.Group(),mP=M({map:TX.pants}),mS=M({map:TX.shirt}),mSk=M({map:TX.skin}),mH=M({map:TX.hair}),mB=M({map:TX.beard});
  for(const s of[-1,1]){const l=box(.18,.8,.2,mP);l.position.set(s*.12,.48,0);g.add(l);const b=box(.22,.14,.3,M({color:0x2a1e16}));b.position.set(s*.12,.07,.03);g.add(b)}
  const tor=box(.56,.7,.32,mS);tor.position.y=1.2;g.add(tor);const belt=box(.58,.07,.34,M({color:0xe9c46a}));belt.position.y=.9;g.add(belt);
  const arms=[];for(const s of[-1,1]){const a=new THREE.Group();a.position.set(s*.37,1.5,0);const u=box(.16,.66,.18,mS);u.position.y=-.32;a.add(u);const hd=box(.13,.13,.13,mSk);hd.position.y=-.7;a.add(hd);g.add(a);arms.push(a)}
  const head=new THREE.Group();head.position.y=1.57;const hm=[mSk,mSk,mH,mSk,M({map:TX.face}),mH];const hb=box(.38,.42,.38,hm);hb.position.y=.22;head.add(hb);
  const br=box(.4,.24,.12,mB);br.position.set(0,.08,.18);head.add(br);const cap=box(.42,.12,.42,mH);cap.position.y=.47;head.add(cap);g.add(head);
  if(withAxe){const ax=makeAxe(.8);ax.position.set(0,-.72,0);ax.rotation.set(Math.PI,0,-.15);arms[1].add(ax)}
  g.userData={arms,head};return g}
function makeAxe(s=1){const g=new THREE.Group();const h=new THREE.Mesh(new THREE.CylinderGeometry(.035,.04,.95,6),M({map:TX.bark}));h.position.y=.47;g.add(h);
  const mm=M({map:TX.metal});const head=box(.1,.17,.08,mm);head.position.set(.02,.88,0);g.add(head);const bl=box(.2,.24,.05,mm);bl.position.set(.16,.86,0);g.add(bl);
  const edge=box(.04,.27,.055,M({color:0xd0d4d8}));edge.position.set(.27,.86,0);g.add(edge);g.scale.setScalar(s);return g}
const logMats=()=>[M({map:TX.bark}),M({map:TX.ring}),M({map:TX.ring})];
function makeLog(r,len,seg=8){const geo=new THREE.CylinderGeometry(r,r,len,seg);geo.rotateZ(Math.PI/2);return new THREE.Mesh(geo,logMats())}
function makePine(h,far){const g=new THREE.Group(),m=M({map:far?TX.pineFar:TX.pine});const tr=new THREE.Mesh(new THREE.CylinderGeometry(h*.03,h*.04,h*.25,5),M({map:TX.bark}));tr.position.y=h*.12;g.add(tr);
  [[.24,.42,.42],[.19,.36,.62],[.13,.3,.82]].forEach(([r,hh,y])=>{const c=new THREE.Mesh(new THREE.ConeGeometry(h*r,h*hh,6),m);c.position.y=h*y-h*.1;g.add(c)});return g}

// ---------- мир: лес ----------
const forest=new THREE.Group();scene.add(forest);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140,14,14),M({map:TX.grass}));ground.rotation.x=-Math.PI/2;forest.add(ground);
{const r=mulberry(31);for(let i=0;i<150;i++){const a=r()*Math.PI*2,d=9+r()*45;const x=Math.cos(a)*d,z=Math.sin(a)*d;const p=makePine(4+r()*5,d>28);p.position.set(x,0,z);p.rotation.y=r()*6;forest.add(p)}
 for(let i=0;i<40;i++){const a=r()*Math.PI*2,d=6+r()*30;const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(.2+r()*.4,0),M({color:0x7a7f8a}));rock.position.set(Math.cos(a)*d,.1,Math.sin(a)*d);forest.add(rock)}}
const guy=makeGuy(false);guy.position.set(-2.2,0,1.2);forest.add(guy);
const guyAxe=makeGuy(true);guyAxe.position.set(-1.6,0,1.4);forest.add(guyAxe);
const HOUSE={c:new THREE.Vector3(2.5,0,-.6),w:4,d:3.5,h:2.5};
// «призрак» дома (как режим постройки в игре)
const ghost=(()=>{const g=new THREE.Group(),m=new THREE.LineBasicMaterial({color:0xff3030,fog:false});
  const b=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(HOUSE.w,HOUSE.h,HOUSE.d)),m);b.position.y=HOUSE.h/2;g.add(b);
  const rg=new THREE.CylinderGeometry(0,HOUSE.w*.62,1.4,4,1);rg.rotateY(Math.PI/4);rg.scale(1,1,HOUSE.d/HOUSE.w);const roof=new THREE.LineSegments(new THREE.EdgesGeometry(rg),m);roof.position.y=HOUSE.h+.7;g.add(roof);
  g.position.copy(HOUSE.c);forest.add(g);g.userData.m=m;return g})();
// дом из бруса: 10 венцов x 4 стены
const brus=[];{const mm=M({map:TX.planed}),bh=.25,th=.22,r=mulberry(41);
  for(let i=0;i<10;i++)for(let s=0;s<4;s++){const alongX=s<2;const len=alongX?HOUSE.w+th:HOUSE.d-th;const m=box(alongX?len:th,bh-.01,alongX?th:len,mm);
    const p=new THREE.Vector3(alongX?0:(s===2?-1:1)*HOUSE.w/2,bh/2+i*bh,alongX?(s===0?-1:1)*HOUSE.d/2:0).add(HOUSE.c);
    const dirv=p.clone().sub(HOUSE.c).setY(0).normalize();brus.push({m,p,v:new THREE.Vector3(dirv.x*(2+r()*4),3+r()*5,dirv.z*(2+r()*4)),w:new THREE.Vector3(r()*8-4,r()*8-4,r()*8-4),t0:13.5+(i*4+s)*.085});forest.add(m)}
  const rm=M({map:TX.roof});for(const s of[-1,1]){const m=box(HOUSE.w+.6,.08,2.45,rm);const p=new THREE.Vector3(0,HOUSE.h+.62,s*1.0).add(HOUSE.c);
    brus.push({m,p,rot:new THREE.Euler(s*.58,0,0),v:new THREE.Vector3((r()-.5)*3,5,s*3),w:new THREE.Vector3(r()*4,r()*4,r()*4),t0:17.0});forest.add(m)}}
// финал: поленница и костёр
const pile=new THREE.Group();{let k=0;[[4,0],[3,1],[2,2]].forEach(([n,row])=>{for(let i=0;i<n;i++){const l=makeLog(.2,2.2,7);l.rotation.y=Math.PI/2;l.position.set(1.6+(i-(n-1)/2)*.42,.2+row*.36,.6);pile.add(l);k++}})}forest.add(pile);
const campfire=new THREE.Group();{for(let i=0;i<4;i++){const l=makeLog(.07,.8,5);l.rotation.y=i*Math.PI/4;l.position.y=.07;campfire.add(l)}
  const fm=new THREE.MeshBasicMaterial({color:0xffa030}),fm2=new THREE.MeshBasicMaterial({color:0xffe070});
  for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(.22-i*.05,.6-i*.1,5),i?fm2:fm);c.position.y=.35;c.userData.i=i;campfire.add(c)}}
campfire.position.set(.2,0,2.6);forest.add(campfire);

// ---------- мир: «справка» ----------
const voidW=new THREE.Group();scene.add(voidW);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),M({map:TX.checker}));floor.rotation.x=-Math.PI/2;voidW.add(floor);
// C: бревно и брус внутри
const cLog=new THREE.Group();voidW.add(cLog);
const bigLog=makeLog(.8,4,8);bigLog.material.forEach(m=>m.transparent=true);cLog.add(bigLog);
const brusIn=box(4.06,1.13,1.13,M({map:TX.planed}));brusIn.visible=false;cLog.add(brusIn);
const brusWire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(4.1,1.13,1.13)),new THREE.LineBasicMaterial({color:0xff3030,fog:false,depthTest:false}));cLog.add(brusWire);
const sawL=new THREE.Group(),sawR=new THREE.Group(),saw=new THREE.Group();{const sm=M({map:TX.saw,transparent:true,alphaTest:.5,side:THREE.DoubleSide});
  const tL=TX.saw.clone();tL.repeat.set(.5,1);tL.needsUpdate=true;const tR=TX.saw.clone();tR.repeat.set(.5,1);tR.offset.set(.5,0);tR.needsUpdate=true;
  const bl=new THREE.Mesh(new THREE.PlaneGeometry(.8,.32),M({map:tL,transparent:true,alphaTest:.5,side:THREE.DoubleSide}));bl.position.x=-.4;sawL.add(bl);
  const hd=box(.32,.3,.07,M({map:TX.bark}));hd.position.set(-.95,.03,0);sawL.add(hd);
  const br=new THREE.Mesh(new THREE.PlaneGeometry(.8,.32),M({map:tR,transparent:true,alphaTest:.5,side:THREE.DoubleSide}));br.position.x=.4;sawR.add(br);
  saw.add(sawL,sawR);saw.scale.setScalar(1.7);cLog.add(saw)}
// D: сруб
const srub=new THREE.Group();voidW.add(srub);const srubLogs=[];{const r=.2,step=r*2*.86,S=2.2;
  for(let i=0;i<8;i++){for(let k=0;k<4;k++){const alongX=k<2;const l=makeLog(r,S*2+.9,8);if(!alongX)l.rotation.y=Math.PI/2;
    const y=r+i*step+(alongX?0:step/2);l.position.set(alongX?0:(k===2?-S:S),y,alongX?(k===0?-S:S):0);srub.add(l);srubLogs.push({m:l,y,t0:32.6+i*.42+(alongX?0:.21)+(k%2)*.1})}}
  const top=r+8*step,rm=M({map:TX.roof});const roofs=[];for(const s of[-1,1]){const m=box(S*2+1.2,.1,3.4,rm);m.position.set(0,top+1.0,s*1.38);m.rotation.x=s*.62;srub.add(m);roofs.push(m)}
  const gab=new THREE.Shape([new THREE.Vector2(-S-.1,0),new THREE.Vector2(S+.1,0),new THREE.Vector2(0,1.9)]);
  for(const s of[-1,1]){const gm=new THREE.Mesh(new THREE.ShapeGeometry(gab),M({map:TX.split,side:THREE.DoubleSide}));gm.rotation.y=Math.PI/2;gm.position.set(s*S,top-.05,0);srub.add(gm);roofs.push(gm)}
  const ridge=makeLog(.14,S*2+1.4,6);ridge.position.y=top+2.0;srub.add(ridge);roofs.push(ridge);srub.userData={roofs,top};
  const win=box(.9,.45,.05,M({color:0x1a1410}));win.position.set(0,r+3*step,S+.2);srub.add(win);srub.userData.win=win}
const stump=new THREE.Group();{const s=new THREE.Mesh(new THREE.CylinderGeometry(.45,.5,.7,8),[M({map:TX.bark}),M({map:TX.ring}),M({map:TX.ring})]);s.position.y=.35;stump.add(s)}stump.position.set(4.2,0,2.4);voidW.add(stump);
const bigAxe=makeAxe(2.2);voidW.add(bigAxe);
// E: клинья, половинки, тёс
const eGroup=new THREE.Group();eGroup.rotation.y=.55;voidW.add(eGroup);
const eLog=makeLog(.6,3,8);eGroup.add(eLog);
function makeHalf(sign){const g=new THREE.Group();const geo=new THREE.CylinderGeometry(.6,.6,3,8,1,false,sign>0?-Math.PI/2:Math.PI/2,Math.PI);geo.rotateZ(Math.PI/2);
  g.add(new THREE.Mesh(geo,[M({map:TX.bark,side:THREE.DoubleSide}),M({map:TX.ring,side:THREE.DoubleSide}),M({map:TX.ring,side:THREE.DoubleSide})]));
  const f=new THREE.Mesh(new THREE.PlaneGeometry(3,1.2),M({map:TX.split,side:THREE.DoubleSide}));g.add(f);return g}
const halfA=makeHalf(1),halfB=makeHalf(-1);eGroup.add(halfA,halfB);
const wedges=[];{const sh=new THREE.Shape([new THREE.Vector2(-.16,.34),new THREE.Vector2(.16,.34),new THREE.Vector2(0,-.06)]);const geo=new THREE.ExtrudeGeometry(sh,{depth:.14,bevelEnabled:false});geo.translate(0,0,-.07);geo.rotateY(Math.PI/2);
  for(const x of[-.9,0,.9]){const w=new THREE.Mesh(geo,M({color:0x3b3b42}));w.position.x=x;eGroup.add(w);wedges.push(w)}}
const plank=box(3,.12,1.1,M({map:TX.planed}));eGroup.add(plank);
const smallAxe=makeAxe(1.2);eGroup.add(smallAxe);
// щепки
function chipSet(parent,n,seed){const ms=[];const m=M({map:TX.split});for(let i=0;i<n;i++){const c=box(.09,.03,.05,m);c.visible=false;parent.add(c);ms.push(c)}

window.__ready=(async()=>{await document.fonts.load('8px "Press Start 2P"','АБВабвЁё');await document.fonts.load('16px "Press Start 2P"','А');await document.fonts.load('32px "Press Start 2P"','А');return document.fonts.check('8px "Press Start 2P"','Аа')})();
if(!window.__RENDER_MODE){window.__ready.then(()=>{let st=null;const go=ts=>{if(st===null)st=ts;render(((ts-st)/1000)%T);requestAnimationFrame(go)};requestAnimationFrame(go);out.addEventListener('click',()=>st=null)})}
