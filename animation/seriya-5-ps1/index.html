<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Изба: серия 5 (PS1)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000}
  #out{position:absolute;inset:0;margin:auto;display:block;height:100vh;width:133.33vh;max-width:100vw;max-height:75vw;image-rendering:pixelated}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>

<body>
<canvas id="out" width="960" height="720"></canvas>
<script type="module">
// Серия 5 «Ловушка». PS1-стиль: 320x240, дрожащие вершины, аффинные текстуры, плоские грани, 15 fps, 15-бит цвет + дизеринг.
import * as THREE from 'three';
const T=60, FPS=15, RW=320, RH=240;

// ---------- утилиты ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b)=>mulberry((a*73856093)^(b*19349663))();
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3), eIn=k=>k*k*k, eInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const col=h=>new THREE.Color(h);

// ---------- рендерер ----------
const glr=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});
glr.setPixelRatio(1);glr.setSize(RW,RH,false);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(58,RW/RH,0.05,500);
const SNAP={value:new THREE.Vector2(RW/2,RH/2)};
function ps1(mat){mat.onBeforeCompile=s=>{s.uniforms.uSnap=SNAP;
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nuniform vec2 uSnap;\nvarying float vAffW;')
   .replace('#include <project_vertex>',`#include <project_vertex>
    vec4 sp=gl_Position; sp.xy=floor(sp.xy/sp.w*uSnap+0.5)/uSnap*sp.w; gl_Position=sp; vAffW=gl_Position.w;
    #ifdef USE_MAP
    vMapUv*=vAffW;
    #endif`);
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying float vAffW;')
   .replace('#include <map_fragment>',`#ifdef USE_MAP
    vec4 sampledDiffuseColor=texture2D(map,vMapUv/vAffW); diffuseColor*=sampledDiffuseColor;
    #endif`)};
  mat.customProgramCacheKey=()=>'ps1'+(mat.map?'m':'');return mat}
const M=(o={})=>ps1(new THREE.MeshLambertMaterial({flatShading:true,...o}));

// ---------- текстуры ----------
function tex(w,h,fn,rep=[1,1]){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);
  const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);t.colorSpace=THREE.SRGBColorSpace;return t}
function noise(g,w,h,pal,seed){const r=mulberry(seed);for(let y=0;y<h;y++)for(let x=0;x<w;x++){g.fillStyle=pal[Math.floor(r()*pal.length)];g.fillRect(x,y,1,1)}}
const TX={
  bark:tex(16,32,(g,w,h)=>{noise(g,w,h,['#6b4a2e','#5a3d24','#7a5634'],3);g.fillStyle='rgba(40,25,10,.5)';for(let x=1;x<w;x+=4)g.fillRect(x,0,1,h)}),
  ring:tex(32,32,(g,w,h)=>{for(let y=0;y<h;y++)for(let x=0;x<w;x++){const d=Math.hypot(x-15.5,y-15.5);g.fillStyle=d>14.5?'#5a3d24':d>13?'#7a5634':(Math.floor(d/2.2)%2?'#d9b27a':'#c49a62');g.fillRect(x,y,1,1)}}),
  planks:tex(64,32,(g,w,h)=>{noise(g,w,h,['#a87c4f','#9c7246','#b48758'],4);g.fillStyle='rgba(50,30,15,.6)';for(let y=0;y<h;y+=8)g.fillRect(0,y,w,1);const r=mulberry(9);for(let y=0;y<h;y+=8)g.fillRect(r()*w|0,y,1,8)},[3,3]),
  plank1:tex(32,8,(g,w,h)=>{noise(g,w,h,['#b48758','#a87c4f','#c0935f'],40);g.fillStyle='rgba(50,30,15,.6)';g.fillRect(0,0,w,1);g.fillRect(0,h-1,w,1);g.fillStyle='#3a2a1a';g.fillRect(3,3,1,1);g.fillRect(w-4,3,1,1)}),
  shirt:tex(16,16,(g,w,h)=>{noise(g,w,h,['#b8432f','#a83a28','#c04a34'],9);g.fillStyle='#e9d9a8';g.fillRect(9,0,1,7)}),
  pants:tex(8,8,(g,w,h)=>noise(g,w,h,['#3a3a40','#34343a','#40404a'],10)),
  skin:tex(8,8,(g,w,h)=>noise(g,w,h,['#e8b98f','#e0b088'],11)),
  hair:tex(8,8,(g,w,h)=>noise(g,w,h,['#5a3a22','#6a4428','#4e321d'],12)),
  face:tex(16,16,(g,w,h)=>{noise(g,w,h,['#e8b98f','#e0b088'],13);g.fillStyle='#5a3a22';g.fillRect(0,0,16,3);g.fillRect(3,5,4,1);g.fillRect(9,5,4,1);
    g.fillStyle='#1e1e1e';g.fillRect(4,7,2,2);g.fillRect(10,7,2,2);g.fillStyle='#c98f6a';g.fillRect(7,9,2,2)}),
  faceO:tex(16,16,(g,w,h)=>{noise(g,w,h,['#e8b98f','#e0b088'],13);g.fillStyle='#5a3a22';g.fillRect(0,0,16,3);g.fillRect(3,4,4,1);g.fillRect(9,4,4,1);
    g.fillStyle='#1e1e1e';g.fillRect(4,6,2,3);g.fillRect(10,6,2,3);g.fillStyle='#3a1a10';g.fillRect(6,11,4,4)}),
  faceZ:tex(16,16,(g,w,h)=>{noise(g,w,h,['#e8b98f','#e0b088'],13);g.fillStyle='#5a3a22';g.fillRect(0,0,16,3);g.fillRect(3,5,4,1);g.fillRect(9,5,4,1);
    g.fillStyle='#1e1e1e';g.fillRect(4,8,3,1);g.fillRect(10,8,3,1);g.fillStyle='#c98f6a';g.fillRect(7,9,2,2)}),
  beard:tex(8,8,(g,w,h)=>noise(g,w,h,['#7a4e2a','#6a4224','#855632'],14)),
  metal:tex(8,8,(g,w,h)=>noise(g,w,h,['#7e848a','#8a9096','#727880'],15)),
  brick:tex(32,32,(g,w,h)=>{g.fillStyle='#b8b0a0';g.fillRect(0,0,w,h);const r=mulberry(17);for(let row=0;row<4;row++){const off=row%2?8:0;for(let x=-8;x<w;x+=16){g.fillStyle=['#a8432c','#b34b32','#9c3d28','#ab4630'][r()*4|0];g.fillRect(x+off+1,row*8+1,14,6)}}},[2,1]),
  basalt:tex(16,16,(g,w,h)=>noise(g,w,h,['#d8d2b0','#cfc8a2','#e0dabb'],21)),
  moss:tex(16,16,(g,w,h)=>noise(g,w,h,['#5a7a3a','#4c6c30','#6a8a44'],34),[4,1]),
  straw:tex(16,16,(g,w,h)=>{noise(g,w,h,['#d8b65a','#c9a44a','#e4c66c','#b8923e'],50);g.fillStyle='rgba(120,90,30,.6)';const r=mulberry(51);for(let i=0;i<10;i++)g.fillRect(r()*w|0,r()*h|0,4,1)}),
  canvas:tex(16,16,(g,w,h)=>{noise(g,w,h,['#cfc2a0','#c4b694','#d8cca8'],52);g.fillStyle='rgba(90,80,60,.25)';for(let i=0;i<w;i+=2){g.fillRect(i,0,1,h);g.fillRect(0,i,w,1)}}),
  mouse:tex(8,8,(g,w,h)=>noise(g,w,h,['#8a8a92','#7c7c84','#96969e'],53)),
  wormwood:tex(8,8,(g,w,h)=>noise(g,w,h,['#9fb08a','#8ea078','#b0c09a'],54)),
};
// туман: полупрозрачные клочья
function fogTex(seed,c){return tex(64,64,(g,w,h)=>{const r=mulberry(seed);g.clearRect(0,0,w,h);for(let i=0;i<26;i++){const x=r()*w,y=r()*h,rr=6+r()*12;
  for(const [dx,dy] of[[0,0],[w,0],[-w,0],[0,h],[0,-h]]){g.fillStyle=c;g.globalAlpha=.25+r()*.25;g.beginPath();g.arc(x+dx,y+dy,rr,0,7);g.fill()}}g.globalAlpha=1},[3,3])}
TX.fog1=fogTex(60,'#7aa0ff');TX.fog2=fogTex(61,'#9ab8ff');TX.haze=fogTex(62,'#ff9a4a');

// ---------- свет ----------
const amb=new THREE.AmbientLight(0xffffff,1);scene.add(amb);
const dir=new THREE.DirectionalLight(0xffffff,1);scene.add(dir,dir.target);
const fireL=new THREE.PointLight(0xff8a3a,0,14,1.4);scene.add(fireL);
const topL=new THREE.PointLight(0xffa050,0,9,1.2);scene.add(topL);
scene.fog=new THREE.Fog(0x0a0c18,9,18);

// ---------- модели ----------
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
function makeGuy(){const g=new THREE.Group(),mP=M({map:TX.pants}),mS=M({map:TX.shirt}),mSk=M({map:TX.skin}),mH=M({map:TX.hair}),mB=M({map:TX.beard});
  const legs=[];for(const s of[-1,1]){const lg=new THREE.Group();lg.position.set(s*.12,.88,0);const l=box(.18,.8,.2,mP);l.position.y=-.4;lg.add(l);const b=box(.22,.14,.3,M({color:0x2a1e16}));b.position.set(0,-.81,.03);lg.add(b);g.add(lg);legs.push(lg)}
  const tor=box(.56,.7,.32,mS);tor.position.y=1.2;g.add(tor);const belt=box(.58,.07,.34,M({color:0xe9c46a}));belt.position.y=.9;g.add(belt);
  const arms=[];for(const s of[-1,1]){const a=new THREE.Group();a.position.set(s*.37,1.5,0);const u=box(.16,.66,.18,mS);u.position.y=-.32;a.add(u);const hd=box(.13,.13,.13,mSk);hd.position.y=-.7;a.add(hd);g.add(a);arms.push(a)}
  const head=new THREE.Group();head.position.y=1.57;const fm=M({map:TX.face}),fo=M({map:TX.faceO}),fz=M({map:TX.faceZ});const hm=[mSk,mSk,mH,mSk,fm,mH];const hb=box(.38,.42,.38,hm);hb.position.y=.22;head.add(hb);
  const br=box(.4,.24,.12,mB);br.position.set(0,.08,.18);head.add(br);const cap=box(.42,.12,.42,mH);cap.position.y=.47;head.add(cap);g.add(head);
  g.userData={arms,legs,head,hb,fm,fo,fz};return g}
function poseGuy(g,o={}){const U=g.userData;U.arms[0].rotation.set(o.ax0||0,0,o.az0??-.06);U.arms[1].rotation.set(o.ax1||0,0,o.az1??.06);
  U.legs[0].rotation.set(o.l0||0,0,0);U.legs[1].rotation.set(o.l1||0,0,0);U.head.rotation.set(o.hx||0,o.hy||0,o.hz||0);U.hb.material[4]=o.shock?U.fo:o.sleep?U.fz:U.fm}
const logMats=()=>[M({map:TX.bark}),M({map:TX.ring}),M({map:TX.ring})];
function makeLog(r,len,seg=8,mats){const geo=new THREE.CylinderGeometry(r,r,len,seg);geo.rotateZ(Math.PI/2);return new THREE.Mesh(geo,mats||logMats())}
const fM1=new THREE.MeshBasicMaterial({color:0xff7a20,fog:false}),fM2=new THREE.MeshBasicMaterial({color:0xffd060,fog:false}),fM3=new THREE.MeshBasicMaterial({color:0xff4a10,fog:false});
function makeFlame(s=1,id=0){const g=new THREE.Group();[[.22,.7,fM3,0],[.17,.55,fM1,.05],[.1,.38,fM2,.1]].forEach(([r,h,m,y],i)=>{const c=new THREE.Mesh(new THREE.ConeGeometry(r,h,5),m);c.position.y=h/2+y;c.userData.i=i;g.add(c)});g.scale.setScalar(s);g.userData.id=id;return g}
function flick(f,t,grow=1){const fr=Math.floor(t*FPS);f.children.forEach(c=>{const h=hash(f.userData.id*7+c.userData.i,fr);c.scale.set(.8+h*.4,(.7+h*.6),.8+h*.4);c.rotation.y=h*3});f.scale.setScalar(f.userData.s0*grow)}
function makeFireplace(o){const g=new THREE.Group(),bm=M({map:TX.brick});const W=1.6,D=.75,ch=.22;
  for(let i=0;i<6;i++){const m=box(W,ch-.005,D,bm);m.position.y=o.base+ch/2+i*ch;g.add(m)}
  const top=o.base+6*ch;for(let i=0;i<Math.ceil((o.chimTop-top)/ch);i++){const m=box(.55,ch-.005,.55,bm);m.position.set(0,top+ch/2+i*ch,-.05);g.add(m)}
  const hole=box(.9,.62,.06,M({color:0x140c08}));hole.position.set(0,o.base+.45,D/2+.01);g.add(hole);
  const fl=makeFlame(.9,o.id||1);fl.userData.s0=.9;fl.position.set(0,o.base+.18,.1);g.add(fl);
  g.userData={flame:fl};return g}

// ---------- изба (как в конце серии 3) ----------
const room=new THREE.Group();scene.add(room);
const RZ=-3,RX=4,RH2=3.2;
{const fl=box(RX*2,.1,7.5,M({map:TX.planks}));fl.position.set(0,-.05,.5);room.add(fl);
 const ceil=box(RX*2+.4,.14,7.5,M({map:TX.planks}));ceil.position.set(0,RH2+.07,.5);room.add(ceil);
 for(const x of[-2.6,-.9,.9,2.6]){const b=box(.18,.22,7.4,M({map:TX.bark}));b.position.set(x,RH2-.11,.5);room.add(b)}
 const r=.18,step=.33;for(let i=0;i<10;i++){const l=makeLog(r,RX*2+.6,8);l.position.set(0,r+i*step,RZ);room.add(l)}
 for(const s of[-1,1])for(let i=0;i<10;i++){const l=makeLog(r,7.6,8);l.rotation.y=Math.PI/2;l.position.set(s*RX,r+i*step+step/2,.6);room.add(l)}}
const fp=makeFireplace({base:0,chimTop:RH2+.3,id:5});fp.position.set(0,0,RZ+.95);room.add(fp);
{const sc=box(2.6,3.0,.06,M({map:TX.basalt}));sc.position.set(0,1.5,RZ+.24);room.add(sc);
 const sh=box(1.8,.02,.8,M({map:TX.metal}));sh.position.set(0,.01,RZ+.95+.38+.4);room.add(sh)}
const rzd=box(1.25,.42,1.25,M({map:TX.brick}));rzd.position.set(0,RH2+.05,RZ+.9);room.add(rzd);   // разделка из серии 2
// застеклённое окно из серии 3
const TXnight=tex(32,24,(g,w,h)=>{for(let y=0;y<h;y++){g.fillStyle=`rgb(${150+y*3|0},${180+y*2|0},${220+y|0})`;g.fillRect(0,y,w,1)}g.fillStyle='#fff4d8';g.fillRect(4,4,4,4);
  g.fillStyle='#f4f8ff';g.fillRect(0,17,w,7);const r=mulberry(35);for(let i=0;i<7;i++){const x=2+i*5+(r()*2|0),hh=7+(r()*6|0);for(let k=0;k<hh;k++){g.fillStyle=k<2?'#f4f8ff':'#2a4a38';g.fillRect(x-(k>>2),18-hh+k,1+(k>>1),1)}}});
{const WZ=.4,WY=1.7,dk=new THREE.MeshBasicMaterial({color:0x0a0a10,fog:false});
 const hole=box(.5,1.0,1.4,[new THREE.MeshBasicMaterial({map:TXnight,fog:false}),dk,dk,dk,dk,dk]);hole.position.set(-RX+.02,WY,WZ);room.add(hole);
 const wf=new THREE.Group(),wm=M({map:TX.planks});for(const y of[-.5,0,.5]){const b=box(.08,.07,1.5,wm);b.position.set(0,y,0);wf.add(b)}for(const z of[-.7,0,.7]){const b=box(.08,1.07,.07,wm);b.position.set(0,0,z);wf.add(b)}
 const gl=box(.02,1.0,1.4,M({color:0xbfe6e0,transparent:true,opacity:.35,emissive:0x406060,emissiveIntensity:.4}));gl.position.x=-.02;wf.add(gl);wf.position.set(-RX+.3,WY,WZ);room.add(wf)}
// мышиная нора в задней стене
const MH={x:2.8,z:RZ+.19};{const h=new THREE.Mesh(new THREE.CircleGeometry(.17,8,0,Math.PI),new THREE.MeshBasicMaterial({color:0x050302}));h.position.set(MH.x,0,MH.z);room.add(h)}
// мужик: стоя и «лёжа» (поворотник вокруг оси тела)
const guy=makeGuy();room.add(guy);
const lie=new THREE.Group();room.add(lie);const guyL=makeGuy();guyL.rotation.z=-Math.PI/2;guyL.position.x=-1.05;lie.add(guyL);
function setLie(x,y,z,roll,yaw=0){lie.position.set(x,y+.3-.13*Math.abs(Math.sin(roll)),z);lie.rotation.set(0,yaw,0);lie.rotateX(roll)}
// мышь
function makeMouse(){const g=new THREE.Group(),m=M({map:TX.mouse}),pink=M({color:0xe8a0a8});
  const body=new THREE.Mesh(new THREE.IcosahedronGeometry(.11,0),m);body.scale.set(1.5,1,1);body.position.y=.1;g.add(body);
  const head=new THREE.Group();head.position.set(.17,.13,0);const hc=new THREE.Mesh(new THREE.ConeGeometry(.07,.16,6),m);hc.rotation.z=-Math.PI/2;hc.position.x=.04;head.add(hc);
  const nose=box(.03,.03,.03,pink);nose.position.x=.13;head.add(nose);const ears=[];for(const s of[-1,1]){const e=new THREE.Group();e.position.set(-.02,.05,s*.05);const ee=box(.02,.09,.08,pink);ee.position.y=.04;e.add(ee);head.add(e);ears.push(e)}
  for(const s of[-1,1]){const ey=box(.025,.025,.025,new THREE.MeshBasicMaterial({color:0x000000}));ey.position.set(.06,.03,s*.04);head.add(ey)}g.add(head);
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(.008,.012,.32,4),pink);tail.rotation.z=Math.PI/2-.4;tail.position.set(-.29,.06,0);g.add(tail);
  const bindle=new THREE.Group();const st=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.3,4),M({map:TX.bark}));st.rotation.z=.7;bindle.add(st);
  const bag=new THREE.Mesh(new THREE.IcosahedronGeometry(.05,0),M({color:0xc03030}));bag.position.set(-.1,.12,0);bindle.add(bag);bindle.position.set(0,.22,.06);g.add(bindle);
  g.scale.setScalar(1.6);g.userData={head,ears,bindle,body};return g}
const mouse=makeMouse();room.add(mouse);
function poseMouse(o={}){const U=mouse.userData;U.ears.forEach((e,i)=>e.rotation.set((i?-1:1)*(o.droop||0)*1.2,0,0));U.head.rotation.set(0,0,(o.nod||0));U.bindle.visible=!!o.bindle;U.body.position.y=.1+(o.hop||0)}

// полати
const PY=2.25;const polati=new THREE.Group();room.add(polati);const planks=[];
{const bm=M({map:TX.bark});for(const z of[-2.75,-1.1]){const b=box(3.6,.14,.14,bm);b.position.set(2.2,PY-.1,z);polati.add(b)}
 const post=box(.14,PY-.1,.14,bm);post.position.set(.6,(PY-.1)/2,-1.1);polati.add(post);polati.userData.post=post;
 for(let i=0;i<8;i++){const p=box(.41,.06,1.85,M({map:TX.plank1}));p.position.set(3.85-.21-i*.425,PY,-1.925);polati.add(p);planks.push(p)}}
const bortik=box(3.3,.22,.06,M({map:TX.plank1}));bortik.position.set(2.2,PY+.14,-1.0);room.add(bortik);
const ladder=new THREE.Group();{const bm=M({map:TX.bark});for(const s of[-1,1]){const r=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,2.5,5),bm);r.position.set(s*.24,1.25,0);ladder.add(r)}
  for(let i=0;i<7;i++){const r=box(.48,.05,.05,bm);r.position.set(0,.3+i*.33,0);ladder.add(r)}}
ladder.position.set(1.6,0,-.25);ladder.rotation.x=-.3;room.add(ladder);
// тюфяк
const sack=new THREE.Group();{const b=box(1.9,.22,.85,M({map:TX.canvas}));b.position.y=.11;sack.add(b);sack.userData.b=b}room.add(sack);
const stitches=[];for(let i=0;i<14;i++){const s=box(.07,.02,.02,new THREE.MeshBasicMaterial({color:0x3a2a1a}));room.add(s);stitches.push(s)}
const clumps=[];for(let i=0;i<6;i++){const b=box(.3,.08,.12,M({map:TX.straw}));room.add(b);clumps.push(b)}
const worm=new THREE.Group();{const wm=M({map:TX.wormwood});for(let i=0;i<4;i++){const s=new THREE.Mesh(new THREE.CylinderGeometry(.01,.015,.55,4),wm);s.rotation.z=Math.PI/2+(i-1.5)*.25;s.position.set(0,.02,(i-1.5)*.04);worm.add(s);
